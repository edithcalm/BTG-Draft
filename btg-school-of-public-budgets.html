    <style>
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --text: #1b1f1c;
  --muted: #5b645e;
  --border: #dfe4e0;
  --primary: #0b6b3a;
  --primary-ink: #ffffff;
  --primary-soft: #e3f1e8;
  --accent: #b3261e;
  --accent-soft: #fbe9e7;
  --warn-soft: #fff4dc;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 16px rgba(0, 0, 0, 0.04);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121513;
    --surface: #1b1f1c;
    --text: #e8ece9;
    --muted: #9aa59e;
    --border: #2e3530;
    --primary: #3fb27a;
    --primary-ink: #0b1a12;
    --primary-soft: #1d3428;
    --accent: #ef7a70;
    --accent-soft: #3a1f1d;
    --warn-soft: #3a3220;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}

h1, h2, h3 { line-height: 1.25; margin: 0 0 0.5em; }
h1 { font-size: clamp(1.6rem, 3vw, 2.1rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
input[type="search"], input:not([type]), input[type="text"] {
  font: inherit;
  padding: 0.6rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  min-width: 0;
}
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

.skip { position: absolute; left: -9999px; }
.skip:focus { left: 1rem; top: 1rem; z-index: 99; background: var(--surface); padding: 0.5rem 1rem; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(#111 0 30%, #fff 30% 35%, #b3261e 35% 65%, #fff 65% 70%, #0b6b3a 70%);
  border: 1px solid var(--border);
}
.tagline { color: var(--muted); font-size: 0.9rem; }
.menu-toggle { display: none; font-size: 1.3rem; background: none; border: 0; color: var(--text); cursor: pointer; padding: 0.25rem 0.5rem; }

/* Layout */
.layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 57px); }
.nav {
  position: sticky; top: 57px; align-self: start;
  height: calc(100vh - 57px);
  padding: 1rem 0.75rem;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column; gap: 0.2rem;
}
.nav a { display: flex; gap: 0.6rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; }
.nav a:hover { background: var(--bg); }
.nav a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.nav-note { margin-top: auto; font-size: 0.78rem; color: var(--muted); padding: 0 0.5rem; }
main { padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 1180px; width: 100%; min-width: 0; outline: none; }

/* Common */
.lead { font-size: 1.08rem; color: var(--muted); max-width: 70ch; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

.row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

.crumbs { font-size: 0.88rem; color: var(--muted); margin-bottom: 1rem; }
.crumbs a { color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  font: inherit; font-weight: 600;
  padding: 0.6rem 1.1rem;

}

.badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
.badge-beginner, .badge-national { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.badge-intermediate, .badge-county { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge-both { background: var(--warn-soft); color: var(--text); border-color: transparent; }
.badge-done { background: var(--primary); color: var(--primary-ink); border-color: transparent; }

.progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width 0.3s; }

/* Dashboard */
.hero { margin-bottom: 1.5rem; }

.activity li { padding: 0.6rem 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; font-size: 0.92rem; }

/* Course cards */
.course-card { display: flex; flex-direction: column; }

.course-card > p.muted { flex: 1; margin: 0; font-size: 0.93rem; }

.filters input { flex: 1; min-width: 200px; max-width: 380px; }
.chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.chip { font: inherit; font-size: 0.9rem; padding: 0.35rem 0.9rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.chip.active { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

/* Course page */
.course-head { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 2rem; align-items: start; }
.course-head h1 { margin-top: 0.5rem; }
.progress-card { display: flex; flex-direction: column; gap: 0.6rem; }
.progress-card p { margin: 0; }
.module { margin-bottom: 1.5rem; }
.module h3 .muted { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.steps { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.steps li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
.steps li:last-child { border-bottom: 0; }
.steps a { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 0.6rem; }
.steps a:hover { color: var(--primary); }
.steps .tick { width: 1.4rem; height: 1.4rem; display: inline-grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--border); font-size: 0.8rem; color: var(--muted); flex: none; }
.steps li.done .tick { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.steps .quiz-item { background: var(--bg); }
.outcomes { padding-left: 1.2rem; margin: 0; }
.outcomes li { margin-bottom: 0.5rem; }

/* Lesson */
.lesson { max-width: 760px; }
.prose { font-size: 1.03rem; }
.prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.95rem; display: block; overflow-x: auto; }
.prose th, .prose td { text-align: left; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.prose th { background: var(--primary-soft); }
.prose h3 { margin-top: 1.5rem; }
.prose li { margin-bottom: 0.35rem; }
.callout { background: var(--warn-soft); border-left: 4px solid #d99a00; padding: 0.9rem 1rem; border-radius: 0 8px 8px 0; margin: 1.25rem 0; }
.lesson-actions { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

/* Quiz */
.quiz { max-width: 760px; }
.question { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 1rem 1.25rem; margin: 0 0 1rem; }
.question legend { font-weight: 600; padding: 0 0.25rem; display: flex; gap: 0.6rem; align-items: baseline; }
.qnum { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 0.85rem; }
.option { display: flex; gap: 0.6rem; align-items: center; padding: 0.5rem 0.6rem; border-radius: 8px; cursor: pointer; }
.option:hover { background: var(--bg); }
.question.correct { border-color: var(--primary); }
.question.wrong { border-color: var(--accent); }
.option.is-answer { background: var(--primary-soft); font-weight: 600; }
.explain { margin: 0.6rem 0 0; font-size: 0.93rem; }
.question.correct .explain { color: var(--primary); }
.question.wrong .explain { color: var(--accent); }
.result { max-width: 760px; border-width: 2px; }
.result.pass { border-color: var(--primary); }
.result.fail { border-color: var(--accent); }

/* Calendar */
.timeline { list-style: none; padding: 0; margin: 1.5rem 0 0; position: relative; max-width: 820px; }
.timeline::before { content: ""; position: absolute; left: 76px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.tl-item { display: grid; grid-template-columns: 64px 1fr; gap: 2rem; margin-bottom: 1rem; position: relative; }
.tl-item::before { content: ""; position: absolute; left: 70px; top: 1.1rem; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--primary); }
.tl-county::before { border-color: var(--accent); }
.tl-both::before { border-color: #d99a00; }
.tl-date { text-align: right; padding-top: 0.75rem; font-weight: 700; font-size: 0.9rem; line-height: 1.2; }
.tl-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; }
.tl-body h3 { margin: 0.4rem 0 0.2rem; }
.tl-body p { margin: 0; font-size: 0.92rem; }

/* Glossary */
#gloss-search { width: 100%; max-width: 420px; margin: 0.5rem 0 1.5rem; }
.glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.75rem; margin: 0; }
.gloss-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; }
.gloss-item dt { font-weight: 700; color: var(--primary); }
.gloss-item dd { margin: 0.25rem 0 0; font-size: 0.93rem; }

/* Profile */
.danger { border-color: var(--accent); }
#profile-form input { flex: 1; max-width: 320px; }

/* Certificate */
.cert-actions { display: flex; justify-content: space-between; margin-bottom: 1rem; }
.certificate {
  background: #fffdf7; color: #1b1f1c;
  border: 10px double #0b6b3a;
  border-radius: 6px;
  padding: 3rem 2rem;
  text-align: center;
  max-width: 820px; margin: 0 auto;
  position: relative;
}
.flag-bar { display: flex; height: 8px; width: 160px; margin: 0 auto 1.5rem; border-radius: 4px; overflow: hidden; }
.flag-bar span { flex: 1; }
.flag-bar span:nth-child(1) { background: #111; }
.flag-bar span:nth-child(2), .flag-bar span:nth-child(4) { background: #fff; flex: 0.3; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }
.flag-bar span:nth-child(3) { background: #b3261e; }
.flag-bar span:nth-child(5) { background: #0b6b3a; }
.cert-kicker { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; color: #0b6b3a; }
.cert-name { font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.8rem, 5vw, 2.8rem); margin: 0.5rem 0; border-bottom: 1px solid #ccc; display: inline-block; padding: 0 1.5rem 0.4rem; }
.cert-course { font-size: 1.4rem; color: #0b6b3a; }
.certificate .muted { color: #5b645e; }
.cert-org { margin-top: 2rem; font-weight: 600; }

/* Responsive */

  .two-col, .course-head { grid-template-columns: 1fr; }

}
@media (max-width: 760px) {
  .menu-toggle { display: block; }
  .tagline { display: none; }
  .layout { grid-template-columns: 1fr; }

  body.nav-open .nav { transform: none; }
  main { padding: 1.25rem 1rem 3rem; }
  .grid, .glossary { grid-template-columns: 1fr; }
  .timeline::before { left: 56px; }
  .tl-item { grid-template-columns: 48px 1fr; gap: 1.6rem; }

}

@media print {
  .topbar, .nav, .no-print, .skip { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  body { background: #fff; }
}

/* Accounts, instructor dashboard, notifications */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.section-gap { margin-top: 2rem; }
.row h2, .row h3 { margin: 0; }
.auth { max-width: 440px; margin: 2rem auto; }

.stack label { display: flex; flex-direction: column; gap: 0.35rem; font-weight: 600; }
.stack label .small { font-weight: 400; }

.link-btn { font: inherit; font-size: 0.85rem; background: none; border: 0; color: var(--primary); cursor: pointer; text-decoration: underline; padding: 0; }
.toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 50; max-width: calc(100% - 2rem); padding: 0.75rem 1.1rem; border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); font-weight: 600; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

    <script>
/*
 * Course catalogue, budget calendar and glossary for the Kenyan Budget Process LMS.
 *
 * Sources: Constitution of Kenya 2010 (Chapter Twelve, Public Finance) and the
 * Public Finance Management (PFM) Act 2012. Dates are statutory deadlines; always
 * confirm against the latest amendments and the current Budget Calendar.
 */
(function (root) {
  // Branding. Change these to rename the site; they appear in the header, page titles and certificates.
  const SITE = {
    name: "BTG School of Public Budgets",
    tagline: "The Kenyan Budget Process",
    contentReviewed: "October 2026",
    disclaimer:
      "Content is based on the Constitution of Kenya 2010 and the PFM Act 2012 (as amended). It is for learning only, not legal advice.",
  };

  const COURSES = [
    {
      id: "foundations",
      title: "Foundations of Public Finance in Kenya",
      level: "Beginner",
      hours: 1.5,
      summary:
        "What a public budget is, why it matters, and the constitutional rules that govern every shilling the government raises and spends.",
      outcomes: [
        "Explain what a national budget is and the Kenyan financial year",
        "Name the principles of public finance in Article 201",
        "Distinguish the Consolidated Fund, County Revenue Funds and the Contingencies Fund",
        "Describe how revenue is shared between national and county governments",
      ],
      modules: [
        {
          id: "basics",
          title: "Budget Basics",
          lessons: [
            {
              id: "what-is-a-budget",
              title: "What is a public budget?",
              minutes: 8,
              body: `
<p>A <strong>public budget</strong> is the government's plan for how it will raise money (<em>revenue</em>) and how it will spend it (<em>expenditure</em>) over a year. In Kenya the budget is also a <strong>law</strong>: spending is authorised through an Appropriation Act passed by Parliament (or, for counties, by the county assembly).</p>
<h3>Three questions every budget answers</h3>
<ol>
  <li><strong>How much will we collect?</strong> Taxes (income tax, VAT, excise), fees, levies, grants and loans.</li>
  <li><strong>What will we spend it on?</strong> Salaries, operations, development projects, debt repayment and transfers to counties.</li>
  <li><strong>How will we cover any gap?</strong> If spending exceeds revenue, the difference (the <em>fiscal deficit</em>) is financed by borrowing.</li>
</ol>
<h3>Recurrent vs development spending</h3>
<p><strong>Recurrent expenditure</strong> covers the day-to-day running of government: wages, utilities, fuel, maintenance. <strong>Development expenditure</strong> creates long-term assets: roads, hospitals, classrooms, water systems. Kenyan law sets minimum shares for development spending, which you will meet in later courses.</p>
<div class="callout"><strong>Why it matters to you:</strong> the budget decides whether a local dispensary gets drugs, whether a road is tarmacked, and how much tax you pay. Citizens have a constitutional right to take part in this process.</div>`,
            },
            {
              id: "financial-year",
              title: "The financial year and the budget cycle",
              minutes: 7,
              body: `
<p>Kenya's <strong>financial year (FY)</strong> runs from <strong>1 July to 30 June</strong>. A budget labelled "FY 2026/27" covers 1 July 2026 to 30 June 2027.</p>
<h3>The four stages of the cycle</h3>
<table>
  <thead><tr><th>Stage</th><th>What happens</th><th>Lead actors</th></tr></thead>
  <tbody>
    <tr><td>1. Formulation</td><td>Priorities set, ceilings agreed, estimates prepared</td><td>National Treasury, ministries, Sector Working Groups</td></tr>
    <tr><td>2. Approval</td><td>Legislature scrutinises and passes the budget</td><td>National Assembly, Budget &amp; Appropriations Committee</td></tr>
    <tr><td>3. Implementation</td><td>Funds released and spent</td><td>National Treasury, ministries, Controller of Budget</td></tr>
    <tr><td>4. Audit &amp; evaluation</td><td>Accounts audited, results reviewed</td><td>Auditor-General, Public Accounts Committee</td></tr>

<p>Chapter Twelve of the Constitution of Kenya 2010 governs public finance. <strong>Article 201</strong> sets the principles that guide every public finance decision:</p>
<ol type="a">

  <li>The public finance system promotes an <strong>equitable society</strong>: taxation is shared fairly, revenue is shared equitably between national and county governments, and expenditure promotes equitable development, including special provision for marginalised groups and areas.</li>

<p>Formulation begins about ten months before the financial year starts.</p>

<h3>Budget Review and Outlook Paper (BROP), by 30 September</h3>
<p>The BROP looks <em>back</em> and <em>forward</em>:</p>

<p>Kenyan budgets are <strong>programme-based</strong>: money is organised around what government wants to achieve, not only by type of spending.</p>
<h3>The hierarchy</h3>
<p><strong>Vote</strong> (a ministry or department) → <strong>Programme</strong> → <strong>Sub-programme</strong> → economic classification (wages, goods &amp; services, capital).</p>
<h3>What to look for</h3>
<ul>
  <li><strong>Outputs and Key Performance Indicators (KPIs):</strong> what will be delivered, and how many.</li>
  <li><strong>Trends:</strong> compare the allocation with last year's budget and with actual spending.</li>
  <li><strong>Absorption:</strong> what share of the allocation was actually spent. Controller of Budget reports show this.</li>
  <li><strong>Development share:</strong> is the 30% minimum met?</li>
</ul>
<h3>Worked example</h3>
<p>A county allocates KES 200 million to a "Water Supply" programme and spends KES 80 million by year end. Absorption is 80 ÷ 200 = <strong>40%</strong>. Low absorption is a signal to ask why: delayed releases, stalled procurement, or poor planning?</p>`,

    <script>
/*
 * Learner progress: pure helpers (testable in Node) plus a small localStorage wrapper.
 */
(function (root) {
  const STORAGE_KEY = "kbp-lms-v1";
  const MAX_ACTIVITY = 30;

  function emptyState() {
    return { learner: { name: "" }, lessons: {}, quizzes: {}, activity: [] };
  }

  function lessonKey(courseId, moduleId, lessonId) {
    return `${courseId}/${moduleId}/${lessonId}`;
  }

  function quizKey(courseId, moduleId) {
    return `${courseId}/${moduleId}`;
  }

  // Ensures loaded/imported data has the expected shape.
  function normalize(raw) {
    const s = emptyState();
    if (!raw || typeof raw !== "object") return s;
    if (raw.learner && typeof raw.learner.name === "string") s.learner.name = raw.learner.name.slice(0, 80);
    if (raw.lessons && typeof raw.lessons === "object") s.lessons = { ...raw.lessons };
    if (raw.quizzes && typeof raw.quizzes === "object") s.quizzes = { ...raw.quizzes };
    if (Array.isArray(raw.activity)) s.activity = raw.activity.slice(0, MAX_ACTIVITY);
    return s;
  }

  function scoreQuiz(quiz, answers, passMark) {
    const total = quiz.questions.length;
    let correct = 0;
    quiz.questions.forEach((q, i) => {
      if (answers[i] === q.answer) correct++;
    });
    const pct = total ? Math.round((correct / total) * 100) : 0;
    return { correct, total, pct, passed: pct >= passMark };
  }

  function logActivity(state, text, now) {
    state.activity.unshift({ text, at: now });
    state.activity.length = Math.min(state.activity.length, MAX_ACTIVITY);
  }

  function completeLesson(state, courseId, moduleId, lessonId, title, now = new Date().toISOString()) {
    const key = lessonKey(courseId, moduleId, lessonId);
    if (state.lessons[key]) return state;
    state.lessons[key] = now;
    logActivity(state, `Completed lesson "${title}"`, now);
    return state;
  }

  function recordQuiz(state, courseId, moduleId, title, result, now = new Date().toISOString()) {
    const key = quizKey(courseId, moduleId);
    const prev = state.quizzes[key] || { best: 0, attempts: 0, passed: false };
    state.quizzes[key] = {
      best: Math.max(prev.best, result.pct),
      last: result.pct,
      attempts: prev.attempts + 1,
      passed: prev.passed || result.passed,
      at: now,
    };
    logActivity(state, `Scored ${result.pct}% on "${title}" quiz${result.passed ? " (passed)" : ""}`, now);
    return state;
  }

  // Progress counts every lesson plus every module quiz (passed) as one step.
  function courseProgress(course, state) {
    let total = 0;
    let done = 0;
    for (const m of course.modules) {
      for (const l of m.lessons) {
        total++;
        if (state.lessons[lessonKey(course.id, m.id, l.id)]) done++;
      }
      if (m.quiz) {
        total++;
        const q = state.quizzes[quizKey(course.id, m.id)];
        if (q && q.passed) done++;
      }
    }
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0, complete: total > 0 && done === total };
  }

  // First incomplete step in a course, or null when finished.
  function nextStep(course, state) {
    for (const m of course.modules) {
      for (const l of m.lessons) {
        if (!state.lessons[lessonKey(course.id, m.id, l.id)]) return { type: "lesson", module: m, lesson: l };
      }
      const q = m.quiz && state.quizzes[quizKey(course.id, m.id)];
      if (m.quiz && !(q && q.passed)) return { type: "quiz", module: m };
    }
    return null;
  }

  function completionDate(course, state) {
    let latest = "";
    for (const m of course.modules) {
      for (const l of m.lessons) {
        const t = state.lessons[lessonKey(course.id, m.id, l.id)];
        if (t && t > latest) latest = t;
      }
      const q = state.quizzes[quizKey(course.id, m.id)];
      if (q && q.at && q.at > latest) latest = q.at;
    }
    return latest;
  }

  function load(storage) {
    try {
      const raw = storage && storage.getItem(STORAGE_KEY);
      return normalize(raw ? JSON.parse(raw) : null);
    } catch (e) {
      return emptyState();
    }
  }

  function save(storage, state) {
    try {
      storage && storage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable (private mode); progress lives for this session only */
    }
  }

  const api = {
    STORAGE_KEY,
    emptyState,
    normalize,
    lessonKey,
    quizKey,
    scoreQuiz,
    completeLesson,
    recordQuiz,
    courseProgress,
    nextStep,
    completionDate,
    load,
    save,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.LMS_STORE = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
    <script>
/*
 * Talks to the optional server. When the page is opened without the server
 * (from a file or static hosting) detect() reports "local" mode and the app
 * keeps progress in the browser instead.
 */
(function () {
  class ApiError extends Error {
    constructor(status, message) {
      super(message);
      this.status = status;
    }
  }

  async function request(method, path, body) {
    const opts = { method, credentials: "same-origin", headers: {} };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(path, opts);
    } catch (e) {
      throw new ApiError(0, "Can't reach the server. Check your connection.");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new ApiError(res.status, data.error || `Request failed (${res.status})`);
    return data;
  }

  async function detect() {
    if (location.protocol === "file:") return { mode: "local" };
    try {
      const res = await fetch("api/session", { credentials: "same-origin" });
      const data = res.ok && (res.headers.get("content-type") || "").includes("application/json") ? await res.json() : null;
      if (data && "user" in data) return { mode: "server", session: data.user ? data : null };
    } catch (e) {
      /* no server */
    }
    return { mode: "local" };
  }

  window.LMS_API = {
    ApiError,
    detect,
    register: (name, email, password) => request("POST", "api/register", { name, email, password }),
    login: (email, password) => request("POST", "api/login", { email, password }),
    logout: () => request("POST", "api/logout", {}),
    updateMe: (name) => request("PATCH", "api/me", { name }),
    completeLesson: (courseId, moduleId, lessonId) => request("POST", "api/progress/lesson", { courseId, moduleId, lessonId }),
    submitQuiz: (courseId, moduleId, answers) => request("POST", "api/progress/quiz", { courseId, moduleId, answers }),
    resetProgress: () => request("DELETE", "api/progress"),
    learners: () => request("GET", "api/admin/learners"),
    learner: (id) => request("GET", `api/admin/learners/${encodeURIComponent(id)}`),
    setRole: (id, role) => request("PATCH", `api/admin/learners/${encodeURIComponent(id)}`, { role }),
    verify: (code) => request("GET", `api/verify/${encodeURIComponent(code)}`),
  };
})();

</script>
    <script>
/*
 * Single-page app: hash router + views. Depends on LMS_DATA, LMS_STORE and LMS_API.

 * Two modes:

 *  - local:  no server found (opened from a file or static hosting); progress stays in this browser
 */
(function () {
  const { SITE, COURSES, CALENDAR, GLOSSARY, PASS_MARK } = window.LMS_DATA;
  const S = window.LMS_STORE;
  const API = window.LMS_API;
  const storage = (() => {
    try {
      return window.localStorage;
    } catch (e) {
      return null;
    }
  })();

  const ctx = { mode: "local", user: null, certificates: {} };
  let state = S.emptyState();
  const view = document.getElementById("view");

  const isServer = () => ctx.mode === "server";
  const isInstructor = () => isServer() && ctx.user && ctx.user.role === "instructor";
  const persist = () => !isServer() && S.save(storage, state);

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const findCourse = (id) => COURSES.find((c) => c.id === id);
  const findModule = (c, id) => c && c.modules.find((m) => m.id === id);

  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("en-KE", { day: "numeric", month: "long", year: "numeric" });
  }

    return `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(label || "Progress")}"><span style="width:${pct}%"></span></div>`;
  }

  function toast(message, kind = "error") {
    const el = document.createElement("div");
    el.className = `toast toast-${kind}`;
    el.setAttribute("role", kind === "error" ? "alert" : "status");
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  // Runs an async action with the button disabled; a 401 sends the user to sign in.
  async function busy(button, fn) {
    if (button) button.disabled = true;
    try {
      return await fn();
    } catch (err) {
      if (err.status === 401 && isServer()) {
        ctx.user = null;
        location.hash = "#/login";
      }
      toast(err.message || "Something went wrong");
      err.handled = true; // already shown to the user; see the unhandledrejection listener in init()

      if (!isServer()) {

      .map((m, mi) => {

          ? `<li class="${q && q.passed ? "done" : ""} quiz-item"><a href="#/quiz/${c.id}/${m.id}"><span class="tick" aria-hidden="true">${q && q.passed ? "✓" : "?"}</span>Module quiz (${m.quiz.questions.length} questions)</a><span class="muted small">${q ? `Best ${q.best}%` : `Pass ${PASS_MARK}%`}</span></li>`
          : "";

    try {
      d = await API.learner(id);
    } catch (err) {
      view.innerHTML = `<h1>Learner</h1><p class="lead">${esc(err.message)}</p><a class="btn" href="#/admin">Back</a>`;
      return;
    }
    const st = S.normalize(d.state);
    const courses = COURSES.map((c) => {
      const p = S.courseProgress(c, st);
      const cert = d.certificates[c.id];
      const mods = c.modules
        .map((m) => {
          const q = st.quizzes[S.quizKey(c.id, m.id)];
          const lessonsDone = m.lessons.filter((l) => st.lessons[S.lessonKey(c.id, m.id, l.id)]).length;
          return `<tr><td>${esc(m.title)}</td><td>${lessonsDone}/${m.lessons.length}</td><td>${q ? `${q.best}% best · ${q.attempts} attempt${q.attempts > 1 ? "s" : ""}${q.passed ? " ✓" : ""}` : '<span class="muted">Not taken</span>'}</td></tr>`;
        })
        .join("");
      return `<section class="card"><div class="row between"><h3>${esc(c.title)}</h3><strong>${p.pct}%</strong></div>${progressBar(p.pct, c.title)}
        ${cert ? `<p class="small">🎓 Certificate <strong>${esc(cert.code)}</strong> issued ${fmtDate(cert.issuedAt)}</p>` : ""}
        <div class="table-wrap"><table class="data-table compact"><thead><tr><th>Module</th><th>Lessons</th><th>Quiz</th></tr></thead><tbody>${mods}</tbody></table></div></section>`;
    }).join("");
    const isSelf = d.user.id === ctx.user.id;

    view.innerHTML = `
<nav class="crumbs"><a href="#/admin">Instructor dashboard</a> / <span>${esc(d.user.name)}</span></nav>
<header class="row between">
  <div><h1>${esc(d.user.name)}</h1><p class="muted">${esc(d.user.email)} · joined ${fmtDate(d.user.createdAt)} · last active ${d.lastActive ? fmtDate(d.lastActive) : "never"}</p></div>
  <div class="row"><span class="badge${d.user.role === "instructor" ? " badge-both" : ""}">${esc(d.user.role)}</span>
    <button class="btn btn-ghost btn-sm" id="role-btn">${d.user.role === "instructor" ? "Make learner" : "Make instructor"}</button></div>
</header>
<div class="two-col">
  <section>${courses}</section>
  <aside><h2>Recent activity</h2>${
    st.activity.length
      ? `<ul class="activity">${st.activity.slice(0, 15).map((a) => `<li><span>${esc(a.text)}</span><time class="muted small">${fmtDate(a.at)}</time></li>`).join("")}</ul>`
      : '<p class="muted">No activity yet.</p>'
  }</aside>
</div>`;

    const roleBtn = document.getElementById("role-btn");
    roleBtn.addEventListener("click", async () => {
      const role = d.user.role === "instructor" ? "learner" : "instructor";
      if (isSelf && !confirm("Remove your own instructor access?")) return;
      await busy(roleBtn, () => API.setRole(d.user.id, role));
      if (isSelf) {
        ctx.user.role = role;
        renderNav();
        location.hash = "#/";
        return;
      }
      toast(`${d.user.name} is now ${role === "instructor" ? "an instructor" : "a learner"}.`, "ok");
      adminLearnerView(id);
    });
  }

  function forbidden() {
    view.innerHTML = `<h1>Instructors only</h1><p class="lead">You need instructor access to see this page.</p><a class="btn" href="#/">Go to dashboard</a>`;
  }

  function notFound() {
    view.innerHTML = `<h1>Page not found</h1><p class="lead">That page doesn't exist.</p><a class="btn" href="#/">Go to dashboard</a>`;
  }

  // ---------- Navigation & router ----------

  function renderNav() {
    const nav = document.getElementById("nav");
    const signedOut = isServer() && !ctx.user;
    const links = signedOut
      ? [
          ["#/login", "login", "🔑", "Sign in"],
          ["#/register", "register", "✍️", "Create account"],
          ["#/calendar", "calendar", "🗓️", "Budget calendar"],
          ["#/glossary", "glossary", "🔤", "Glossary"],
          ["#/verify", "verify", "✅", "Verify certificate"],
        ]
      : [
          ["#/", "dashboard", "🏠", "Dashboard"],
          ["#/courses", "courses", "📚", "Courses"],
          ["#/calendar", "calendar", "🗓️", "Budget calendar"],
          ["#/glossary", "glossary", "🔤", "Glossary"],
          ["#/profile", "profile", "👤", "Profile & data"],
          ...(isInstructor() ? [["#/admin", "admin", "📊", "Instructor"]] : []),
          ...(isServer() ? [["#/verify", "verify", "✅", "Verify certificate"]] : []),
        ];
    nav.innerHTML = `
${links.map(([href, key, icon, label]) => `<a href="${href}" data-nav="${key}"><span aria-hidden="true">${icon}</span> ${label}</a>`).join("")}
${isServer() && ctx.user ? `<div class="nav-user"><span class="small">${esc(ctx.user.name)}</span><button class="link-btn" id="signout">Sign out</button></div>` : ""}
<p class="nav-note">${esc(SITE.disclaimer)}${isServer() ? "" : " Progress is saved in this browser."}</p>`;
    const so = document.getElementById("signout");
    if (so) so.addEventListener("click", signOut);
  }

  const PUBLIC_ROUTES = new Set(["login", "register", "verify", "calendar", "glossary"]);

  const routes = [
    [/^\/?$/, dashboard, "dashboard"],
    [/^\/courses$/, catalog, "courses"],
    [/^\/course\/([\w-]+)$/, courseView, "courses"],
    [/^\/lesson\/([\w-]+)\/([\w-]+)\/([\w-]+)$/, lessonView, "courses"],
    [/^\/quiz\/([\w-]+)\/([\w-]+)$/, quizView, "courses"],
    [/^\/calendar$/, calendarView, "calendar"],
    [/^\/glossary$/, glossaryView, "glossary"],
    [/^\/certificate\/([\w-]+)$/, certificateView, "courses"],
    [/^\/profile$/, profileView, "profile"],
    [/^\/login$/, () => authView("login"), "login"],
    [/^\/register$/, () => authView("register"), "register"],
    [/^\/verify(?:\/([\w-]+))?$/, verifyView, "verify"],
    [/^\/admin$/, adminView, "admin"],
    [/^\/admin\/learner\/(\d+)$/, adminLearnerView, "admin"],
  ];

  async function render() {
    const path = (location.hash || "#/").slice(1);
    let match = null;
    for (const [re, fn, nav] of routes) {
      const m = path.match(re);
      if (m) {
        match = { fn, nav, args: m.slice(1) };
        break;
      }
    }
    if (match && isServer() && !ctx.user && !PUBLIC_ROUTES.has(match.nav)) {
      location.hash = "#/login";
      return;
    }
    document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", !!match && a.dataset.nav === match.nav));
    document.body.classList.remove("nav-open");
    window.scrollTo(0, 0);
    if (match) await match.fn(...match.args);
    else notFound();
    const h1 = view.querySelector("h1");
    document.title = (h1 ? h1.textContent.trim() + " · " : "") + SITE.name;
    view.focus({ preventScroll: true });
  }

  async function init() {
    document.querySelectorAll("[data-site-name]").forEach((el) => (el.textContent = SITE.name));
    document.querySelectorAll("[data-site-tagline]").forEach((el) => (el.textContent = SITE.tagline));
    window.addEventListener("unhandledrejection", (e) => {
      if (e.reason && e.reason.handled) e.preventDefault();
    });
    document.getElementById("menu-toggle").addEventListener("click", () => document.body.classList.toggle("nav-open"));

    const found = await API.detect();
    ctx.mode = found.mode;
    if (ctx.mode === "server") applySession(found.session);
    else state = S.load(storage);

    renderNav();
    window.addEventListener("hashchange", render);
    render();
  }

  init();
})();

</script>
  </body>
</html>
